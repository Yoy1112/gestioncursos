# Puerto del servidor (Render/Railway suelen asignarlo con la variable PORT)
server.port=${PORT:8080}

# Base de datos H2 (archivo local, no requiere instalar motor aparte)
spring.datasource.url=jdbc:h2:file:./data/gestioncursos;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 para revisar los datos en el navegador: /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf: desactivar cache en desarrollo para ver cambios sin reiniciar
spring.thymeleaf.cache=false

# Nombre de la aplicacion
spring.application.name=gestioncursos
server.forward-headers-strategy=framework