<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Gestión de Cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow-sm" style="width: 380px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Gestión de Cursos</h3>
            <p class="text-center text-muted small">Actividad Unidad 2 - Ejercicio 28</p>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="nombre" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Clave</label>
                    <input type="password" name="clave" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/recuperar-clave}" class="small">¿Olvidaste tu clave?</a>
            </div>

            <div class="alert alert-info small mt-3 mb-0">
                Usuario de prueba: <strong>admin</strong> / <strong>admin123</strong>
            </div>
        </div>
    </div>
</div>
</body>
</html>
