<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar clave</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow-sm" style="width: 420px;">
        <div class="card-body p-4">
            <h4 class="mb-3">Recuperar clave</h4>

            <div class="alert alert-warning small" th:if="${mensaje}" th:text="${mensaje}"></div>

            <form th:action="@{/recuperar-clave}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nombre de usuario</label>
                    <input type="text" name="nombre" class="form-control" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">Recuperar</button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/login}" class="small">Volver a iniciar sesión</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
