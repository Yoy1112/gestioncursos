<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Curso - Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a th:href="@{/home}" class="navbar-brand mb-0 h1">Gestión de Cursos</a>
</nav>

<div class="container mt-4" style="max-width: 700px;">
    <h3 th:text="${curso.id} != null ? 'Editar curso' : 'Nuevo curso'"></h3>

    <form th:action="@{/cursos/guardar}" th:object="${curso}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Nivel</label>
                <select th:field="*{nivel}" class="form-select" required>
                    <option value="Basico">Básico</option>
                    <option value="Intermedio">Intermedio</option>
                    <option value="Avanzado">Avanzado</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Modalidad</label>
                <select th:field="*{modalidad}" class="form-select" required>
                    <option value="Virtual">Virtual</option>
                    <option value="Presencial">Presencial</option>
                    <option value="Mixta">Mixta</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Precio</label>
                <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Horas</label>
                <input type="number" th:field="*{horas}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Número de alumnos</label>
                <input type="number" th:field="*{numAlumnos}" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Profesor</label>
                <input type="text" th:field="*{profesor}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Institución</label>
                <input type="text" th:field="*{institucion}" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha inicio inscripción</label>
                <input type="date" th:field="*{fechaInscripcionInicio}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha fin inscripción</label>
                <input type="date" th:field="*{fechaInscripcionFin}" class="form-control" required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha inicio curso</label>
                <input type="date" th:field="*{fechaInicio}" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha cierre curso</label>
                <input type="date" th:field="*{fechaCierre}" class="form-control" required>
            </div>

            <div class="col-12 mb-3">
                <label class="form-label">Descripción</label>
                <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/cursos}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
