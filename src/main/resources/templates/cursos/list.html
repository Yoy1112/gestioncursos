<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a th:href="@{/home}" class="navbar-brand mb-0 h1">Gestión de Cursos</a>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Cursos</h3>
        <a th:href="@{/cursos/nuevo}" class="btn btn-success btn-sm">+ Nuevo curso</a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Nivel</th>
                <th>Modalidad</th>
                <th>Precio</th>
                <th>Horas</th>
                <th>Profesor</th>
                <th>Institución</th>
                <th>N° Alumnos</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="curso : ${cursos}">
                <td th:text="${curso.id}"></td>
                <td th:text="${curso.nombre}"></td>
                <td th:text="${curso.nivel}"></td>
                <td th:text="${curso.modalidad}"></td>
                <td th:text="${curso.precio}"></td>
                <td th:text="${curso.horas}"></td>
                <td th:text="${curso.profesor}"></td>
                <td th:text="${curso.institucion}"></td>
                <td th:text="${curso.numAlumnos}"></td>
                <td>
                    <a th:href="@{/cursos/editar/{id}(id=${curso.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/cursos/eliminar/{id}(id=${curso.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Eliminar este curso?');">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/home}" class="btn btn-secondary btn-sm">Volver al menú</a>
</div>
</body>
</html>
