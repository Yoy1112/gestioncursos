<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-4">
    <a th:href="@{/home}" class="navbar-brand mb-0 h1">Gestión de Cursos</a>
</nav>

<div class="container mt-4">
    <h3>Reportes parametrizados - Usuarios</h3>

    <div class="row">
        <div class="col-md-6">
            <form th:action="@{/usuarios/reportes}" method="get" class="border rounded p-3 mb-3">
                <h6>Reporte 1: por rol</h6>
                <div class="input-group">
                    <input type="text" name="rol" class="form-control" placeholder="Ej: ADMIN">
                    <button class="btn btn-primary" type="submit">Buscar</button>
                </div>
            </form>
        </div>
        <div class="col-md-6">
            <form th:action="@{/usuarios/reportes}" method="get" class="border rounded p-3 mb-3">
                <h6>Reporte 2: por nombre (contiene)</h6>
                <div class="input-group">
                    <input type="text" name="nombre" class="form-control" placeholder="Ej: ana">
                    <button class="btn btn-primary" type="submit">Buscar</button>
                </div>
            </form>
        </div>
    </div>

    <div th:if="${filtroUsado}" class="alert alert-info" th:text="'Filtro aplicado -> ' + ${filtroUsado}"></div>

    <table class="table table-bordered" th:if="${resultados}">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Rol</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${resultados}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.rol}"></td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/home}" class="btn btn-secondary btn-sm">Volver al menú</a>
</div>
</body>
</html>
